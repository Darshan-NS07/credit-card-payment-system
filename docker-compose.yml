services:

  mysql:
    image: mysql:8.0
    container_name: credit_card_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: credit_card_payment_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    container_name: credit_card_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306  
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    container_name: credit_card_fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306  
    ports:
      - "8001:8001"
    depends_on:
      - mysql

volumes:
  mysql_data: